name: OmniLearn production UI visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-screenshots.yml'
      - 'scripts/verify-home-visual.cjs'
      - 'scripts/verify-study-workspace.cjs'
      - 'public/*.css'
      - 'public/dashboard-shell.js'
      - 'public/product.js'
      - 'public/theme.js'
      - 'public/ui-motion.js'
      - 'public/study-shell.js'
      - 'public/index.html'
      - 'server.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix /tmp/omnilearn-capture playwright@1.56.1 --no-audit --no-fund --ignore-scripts
          /tmp/omnilearn-capture/node_modules/.bin/playwright install --with-deps chromium
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Assert production UI and capture only three required views
        env:
          NODE_PATH: /tmp/omnilearn-capture/node_modules
          QA_SKIP_SCREENSHOTS: '1'
        run: |
          node scripts/verify-home-visual.cjs
          node scripts/verify-study-workspace.cjs
      - name: Upload screenshots and access report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnilearn-production-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7
